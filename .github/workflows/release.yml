# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed:
#   (bump version in app/Cargo.toml)  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/Cargo.toml version $version"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Test
        working-directory: app
        run: cargo test --release

      # Signs the installer for the in-app updater. The key is made once with
      #   npx @tauri-apps/cli@2 signer generate -w ~/.tauri/kosmik-voice.key
      # and stored as the repository secret TAURI_SIGNING_PRIVATE_KEY (the file's contents).
      - name: Build installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes @tauri-apps/cli@2 build

      # latest.json tells installed apps about this version; the updater reads it from
      # releases/latest/download/latest.json and checks the signature before installing.
      - name: Installer and latest.json
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $nsis = "app/target/release/bundle/nsis"
          $exe = "Kosmik-Voice_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$nsis/Kosmik Voice_${version}_x64-setup.exe" "out/$exe"
          $sig = (Get-Content "$nsis/Kosmik Voice_${version}_x64-setup.exe.sig" -Raw).Trim()
          [ordered]@{
            version = $version
            notes = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$exe"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM out/latest.json
          Get-Content out/latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/latest.json
          generate_release_notes: true
