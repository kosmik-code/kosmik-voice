# Builds the Windows installer and publishes it as a GitHub release when a version tag is pushed:
#   (bump version in app/Cargo.toml)  git tag v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version' app/Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/Cargo.toml version $version"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Test
        working-directory: app
        run: cargo test --release

      # Signs the installer for the in-app updater. The key is made once with
      #   npx @tauri-apps/cli@2 signer generate -w ~/.tauri/kosmik-voice.key
      # and stored as the repository secret TAURI_SIGNING_PRIVATE_KEY (the file's contents).
      - name: Build installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes @tauri-apps/cli@2 build

      # latest.json tells installed apps about this version; the updater reads it from
      # releases/latest/download/latest.json and checks the signature before installing.
      - name: Installer and latest.json
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $nsis = "app/target/release/bundle/nsis"
          $exe = "Kosmik-Voice_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$nsis/Kosmik Voice_${version}_x64-setup.exe" "out/$exe"
          $sig = (Get-Content "$nsis/Kosmik Voice_${version}_x64-setup.exe.sig" -Raw).Trim()
          [ordered]@{
            version = $version
            notes = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$exe"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM out/latest.json
          Get-Content out/latest.json

      # A draft first, published only once both files are up, so installed apps never see a latest.json
      # without its installer. Uploads are retried (GitHub sometimes answers 5xx), and re-running a
      # failed job starts again from a clean draft.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $title = "Kosmik Voice $($tag.TrimStart('v'))"
          function Retry([string]$what, [scriptblock]$step) {
            for ($i = 1; $i -le 5; $i++) {
              & $step
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "$what failed (try $i), retrying"; Start-Sleep (10 * $i)
            }
            throw "$what kept failing"
          }
          $draft = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($draft -eq 'false') { throw "$tag is already published" }
          # Done once it's gone, even if the delete itself was answered with a 5xx.
          if ($draft -eq 'true') { Retry 'remove old draft' { gh release delete $tag --yes; gh release view $tag *> $null; $global:LASTEXITCODE = [int]($LASTEXITCODE -eq 0) } }
          # A 5xx can still have created it, so look before creating again.
          Retry 'create draft' { gh release view $tag *> $null; if ($LASTEXITCODE -ne 0) { gh release create $tag --draft --verify-tag --title $title --generate-notes } }
          Retry 'upload' { gh release upload $tag (Get-ChildItem out/*.exe).FullName out/latest.json --clobber }
          Retry 'publish' { gh release edit $tag --draft=false }
