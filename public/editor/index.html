<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kosmik Voice · Editor</title>
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
  <header class="bar">
    <h1 class="brand">Kosmik<span>Voice</span></h1>
    <nav class="tabs" aria-label="Secciones">
      <a href="#discord" data-tab="discord">Discord</a>
      <a href="#users" data-tab="users">Usuarios</a>
      <a href="#presets" data-tab="presets">Presets</a>
    </nav>
    <span id="conn" class="pill tone-bad" title="Estado de Discord">…</span>
    <div class="save-box">
      <span id="dirty" class="dirty" hidden>● Cambios sin guardar</span>
      <button id="discard" type="button" disabled>Descartar</button>
      <button id="save" type="button" class="primary" disabled title="Ctrl+S">Guardar</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="errors" class="errors" hidden></div>

  <main class="layout">
    <section id="panel" class="panel" aria-live="polite"></section>

    <aside class="preview" aria-label="Vista previa">
      <div class="preview-head">
        <h2>Vista previa</h2>
        <label class="mini">Preset <select id="pv-preset"></select></label>
        <label class="mini">Lienzo
          <select id="pv-canvas">
            <option value="1920x1080">1920×1080</option>
            <option value="1280x720">1280×720</option>
            <option value="1080x1920">1080×1920 (vertical)</option>
          </select>
        </label>
        <label class="mini">Fondo
          <select id="pv-bg">
            <option value="checker">Cuadriculado</option>
            <option value="dark">Oscuro</option>
            <option value="light">Claro</option>
          </select>
        </label>
      </div>
      <div id="pv-stage" class="stage bg-checker">
        <iframe id="pv-frame" title="Vista previa del overlay" src="/overlay/preview?preview=1"></iframe>
      </div>
      <p id="pv-caption" class="caption"></p>

      <div class="sim card">
        <div class="sim-head">
          <h3>Simular estados</h3>
          <div class="seg" role="radiogroup" aria-label="Origen">
            <label><input type="radio" name="pv-source" value="live"> Llamada real</label>
            <label><input type="radio" name="pv-source" value="sim" checked> Simulación</label>
          </div>
        </div>
        <div id="sim-body"></div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/editor/editor.js"></script>
</body>
</html>
