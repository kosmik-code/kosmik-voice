<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kosmik Voice · Editor</title>
  <script src="/editor/kosmik-ui.js"></script>
  <link rel="stylesheet" href="/editor/kosmik-ui.css">
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
  <!-- Static text is Spanish until editor.js applies the chosen language (data-i18n = text, data-i18n-attr = attr:key;...). -->
  <header class="bar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>Kosmik<span>Voice</span></h1>
    <nav class="tabs" aria-label="Secciones" data-i18n-attr="aria-label:html.sections">
      <a href="#discord" data-tab="discord">Discord</a>
      <a href="#users" data-tab="users" data-i18n="html.tab.users">Usuarios</a>
      <a href="#presets" data-tab="presets" data-i18n="html.tab.presets">Presets</a>
    </nav>
    <button id="steps-toggle" type="button" class="small" aria-controls="steps" data-i18n="html.firstSteps">Primeros pasos</button>
    <span id="conn" class="pill tone-bad" title="Estado de Discord" data-i18n-attr="title:html.connTitle">…</span>
    <div class="save-box">
      <span id="dirty" class="dirty" hidden data-i18n="html.dirty">● Cambios sin guardar</span>
      <button id="discard" type="button" disabled data-i18n="html.discard">Descartar</button>
      <button id="save" type="button" class="primary" disabled title="Ctrl+S" data-i18n="html.save">Guardar cambios</button>
    </div>
    <details class="k-menu" id="appearance">
      <summary aria-label="Aspecto e idioma" title="Aspecto e idioma" data-i18n-attr="aria-label:html.appearance;title:html.appearance">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 0 0 14z" fill="currentColor"/></svg>
      </summary>
      <div class="k-menu-panel">
        <div class="k-menu-group"><span data-i18n="look.title">Aspecto</span><div id="looks"></div></div>
        <div class="k-menu-group">
          <span data-i18n="lang.group">Idioma</span>
          <div id="lang-switch" class="seg" role="group" aria-label="Idioma" data-i18n-attr="aria-label:lang.group">
            <button type="button" data-lang="es" lang="es" aria-pressed="true" class="active">Español</button>
            <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
          </div>
        </div>
      </div>
    </details>
  </header>

  <div id="update" class="notice update-banner" role="status" hidden></div>
  <div id="notice" class="notice" hidden></div>
  <div id="errors" class="errors" hidden></div>
  <section id="steps" class="steps-bar" aria-label="Primeros pasos" data-i18n-attr="aria-label:html.firstSteps" hidden></section>

  <main class="layout">
    <section id="panel" class="panel" aria-live="polite"></section>

    <aside class="preview" aria-label="Vista previa" data-i18n-attr="aria-label:html.preview">
      <div class="preview-head">
        <h2 data-i18n="html.preview">Vista previa</h2>
        <label class="mini"><span data-i18n="html.pvPreset">Preset</span> <select id="pv-preset"></select></label>
        <label class="mini"><span data-i18n="html.pvCanvas">Lienzo</span> <select id="pv-canvas"></select></label>
        <label class="mini"><span data-i18n="html.pvBg">Fondo</span>
          <select id="pv-bg">
            <option value="checker" data-i18n="html.bg.checker">Cuadriculado</option>
            <option value="dark" data-i18n="html.bg.dark">Oscuro</option>
            <option value="light" data-i18n="html.bg.light">Claro</option>
          </select>
        </label>
      </div>
      <div id="pv-stage" class="stage bg-checker">
        <iframe id="pv-frame" title="Vista previa del overlay" data-i18n-attr="title:html.frameTitle" src="/overlay/preview?preview=1"></iframe>
      </div>
      <p id="pv-caption" class="caption"></p>

      <div class="sim card">
        <div class="sim-head">
          <h3 data-i18n="html.simTitle">Simular estados</h3>
          <div class="seg" role="radiogroup" aria-label="Qué mostrar" data-i18n-attr="aria-label:html.simWhat">
            <label><input type="radio" name="pv-source" value="live"> <span data-i18n="html.simLive">Llamada real</span></label>
            <label><input type="radio" name="pv-source" value="sim" checked> <span data-i18n="html.simSim">Simulación</span></label>
          </div>
        </div>
        <div id="sim-body"></div>
      </div>
    </aside>
  </main>

  <dialog id="gallery" class="dialog" aria-labelledby="gallery-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/editor/editor.js"></script>
</body>
</html>
